%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/axera,ax630c-eip130.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axera AX630C public EIP-130 cryptographic engine

maintainers:
  - OneKVM <dev@onekvm.org>

description: |
  The public mailbox engine performs DMA independently of the CPU's optional
  cryptographic instruction set. Mailbox 2 is used for Linux requests and
  mailbox 1 for loading the vendor firmware. The secure-world engine must
  not be described by this binding.

properties:
  compatible:
    const: axera,ax630c-eip130

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: APB interface clock
      - description: AXI and core clock
      - description: Counter clock

  clock-names:
    items:
      - const: pclk
      - const: core
      - const: cnt

  resets:
    items:
      - description: Main memory access manager reset
      - description: Counter reset
      - description: Core soft reset
      - description: APB interface reset
      - description: AXI master reset

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets

additionalProperties: false
